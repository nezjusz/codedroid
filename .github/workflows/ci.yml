name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # The runner image ships the Android SDK with cmdline-tools; no setup action is needed.
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept SDK licenses and install packages
        run: |
          # The runner image ships cmdline-tools under a versioned directory that is not on PATH,
          # and the version changes over time, so resolve it rather than hardcoding a path.
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          echo "Using $SDKMANAGER"
          export PATH="$(dirname "$SDKMANAGER"):$PATH"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
          "$SDKMANAGER" --list_installed | grep -E 'platforms;android-37|build-tools;37'

      - name: Verify tests pass
        # The live-server suite skips itself when no host is configured, so this is hermetic.
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Verify debug APK assembles
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: codedroid-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
