name: Release

# Manual only: the version is typed into the GitHub UI (Actions -> Release -> Run workflow)
# and becomes both the APK's versionName and the tag it is published under.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 1.0.1'
        required: true
        type: string
      release_notes:
        description: 'Release notes (optional)'
        required: false
        type: string
      prerelease:
        description: 'Mark as a pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # The runner image ships the Android SDK with cmdline-tools; no setup action is needed.
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      # Every workflow input is passed through the environment rather than interpolated into
      # the shell. `${{ }}` inside a `run:` block is script injection: a crafted version string
      # could otherwise execute arbitrary commands on the runner.
      REQUESTED_VERSION: ${{ inputs.version }}
      REQUESTED_NOTES: ${{ inputs.release_notes }}
      PRERELEASE: ${{ inputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version input
        run: |
          if ! printf '%s' "$REQUESTED_VERSION" \
               | grep -Eq '^[0-9]+(\.[0-9]+){0,2}(-[A-Za-z0-9.-]+)?$'; then
            echo "::error::'$REQUESTED_VERSION' is not a valid version. Use 1, 1.2 or 1.0.1 (optional -suffix)."
            exit 1
          fi
          echo "Building v$REQUESTED_VERSION"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept SDK licenses and install packages
        run: |
          # The runner image ships cmdline-tools under a versioned directory that is not on PATH,
          # and the version changes over time, so resolve it rather than hardcoding a path.
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Restore release keystore
        # Absent secrets are tolerated: the build then falls back to the debug key and the release
        # is labelled unsigned below rather than silently pretending to be a Play-ready artefact.
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.CODEDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/codedroid.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Restored release keystore"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No CODEDROID_KEYSTORE_BASE64 secret configured; the APK will be signed with the debug key and cannot be published to Play."
          fi

      - name: Run tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build release APK
        env:
          CODEDROID_KEYSTORE_BASE64: ${{ secrets.CODEDROID_KEYSTORE_BASE64 }}
          CODEDROID_KEYSTORE_PASSWORD: ${{ secrets.CODEDROID_KEYSTORE_PASSWORD }}
          CODEDROID_KEY_ALIAS: ${{ secrets.CODEDROID_KEY_ALIAS }}
          CODEDROID_KEY_PASSWORD: ${{ secrets.CODEDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -PversionName="$REQUESTED_VERSION" --stacktrace

      - name: Name the APK
        id: apk
        run: |
          SRC=app/build/outputs/apk/release/app-release.apk
          test -f "$SRC" || { echo "::error::release APK was not produced"; exit 1; }
          cp "$SRC" "codedroid-v${REQUESTED_VERSION}.apk"
          echo "path=codedroid-v${REQUESTED_VERSION}.apk" >> "$GITHUB_OUTPUT"

      - name: Verify the built version matches the input
        env:
          APK: ${{ steps.apk.outputs.path }}
        run: |
          # Guards against the -P flag silently not reaching Gradle.
          ACTUAL=$("$ANDROID_SDK_ROOT/build-tools/37.0.0/aapt2" dump badging "$APK" \
            | grep -oE "versionName='[^']+'" | head -1 | cut -d"'" -f2)
          if [ "$ACTUAL" != "$REQUESTED_VERSION" ]; then
            echo "::error::built versionName '$ACTUAL' does not match requested '$REQUESTED_VERSION'"
            exit 1
          fi
          echo "Verified versionName=$ACTUAL"

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.path }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          TAG="v$REQUESTED_VERSION"
          NOTES_FILE="$RUNNER_TEMP/notes.md"

          printf '%s\n' "${REQUESTED_NOTES:-Release $TAG}" > "$NOTES_FILE"
          if [ "$SIGNED" != "true" ]; then
            {
              echo
              echo "---"
              echo "Signed with the **debug key** — no release keystore is configured."
              echo "This APK is installable but cannot be published to Google Play."
            } >> "$NOTES_FILE"
          fi

          ARGS=(--title "CodeDroid $TAG" --notes-file "$NOTES_FILE")
          [ "$PRERELEASE" = "true" ] && ARGS+=(--prerelease)

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; replacing the asset."
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" "${ARGS[@]}"
          fi

      - name: Upload APK as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codedroid-v${{ inputs.version }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30
          if-no-files-found: error
