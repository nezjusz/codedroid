name: Release

# Manual only: the version is typed into the GitHub UI (Actions -> Release -> Run workflow)
# and becomes both the APK's versionName and the v-tag it is published under.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 1.0.1'
        required: true
        type: string
      release_notes:
        description: 'Release notes (optional)'
        required: false
        type: string
      prerelease:
        description: 'Mark as a pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # The runner image ships the Android SDK with cmdline-tools; no setup action is needed.
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version input
        run: |
          VERSION='${{ inputs.version }}'
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}(-[A-Za-z0-9.-]+)?$'; then
            echo "::error::'$VERSION' is not a valid version. Use 1, 1.2 or 1.0.1 (optional -suffix)."
            exit 1
          fi
          echo "Building v$VERSION"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept SDK licenses and install packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Restore release keystore
        # Absent secrets are tolerated: the build then falls back to the debug key and the release
        # is labelled unsigned below rather than silently pretending to be a Play-ready artefact.
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.CODEDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/codedroid.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Restored release keystore"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No CODEDROID_KEYSTORE_BASE64 secret configured; the APK will be signed with the debug key and cannot be published to Play."
          fi

      - name: Run tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build release APK
        env:
          CODEDROID_KEYSTORE_BASE64: ${{ secrets.CODEDROID_KEYSTORE_BASE64 }}
          CODEDROID_KEYSTORE_PASSWORD: ${{ secrets.CODEDROID_KEYSTORE_PASSWORD }}
          CODEDROID_KEY_ALIAS: ${{ secrets.CODEDROID_KEY_ALIAS }}
          CODEDROID_KEY_PASSWORD: ${{ secrets.CODEDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            -PversionName='${{ inputs.version }}' \
            --stacktrace

      - name: Name the APK
        id: apk
        run: |
          SRC=app/build/outputs/apk/release/app-release.apk
          test -f "$SRC" || { echo "::error::release APK was not produced"; exit 1; }
          cp "$SRC" "codedroid-v${{ inputs.version }}.apk"
          echo "path=codedroid-v${{ inputs.version }}.apk" >> "$GITHUB_OUTPUT"
          echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Verify the built version matches the input
        run: |
          # Guards against the -P flag silently not reaching Gradle.
          ACTUAL=$("$ANDROID_SDK_ROOT/build-tools/37.0.0/aapt2" dump badging "${{ steps.apk.outputs.path }}" \
            | grep -oE "versionName='[^']+'" | head -1 | cut -d"'" -f2)
          if [ "$ACTUAL" != "${{ inputs.version }}" ]; then
            echo "::error::built versionName '$ACTUAL' does not match requested '${{ inputs.version }}'"
            exit 1
          fi
          echo "Verified versionName=$ACTUAL"

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          NOTES="${NOTES:-Release v${{ inputs.version }}"
          if [ "${{ steps.signing.outputs.signed }}" != "true" ]; then
            NOTES="$NOTES

            ---
            ⚠️ Signed with the **debug key** (no release keystore configured). Installable, but not publishable to Google Play."
          fi
          if gh release view "v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "Tag v${{ inputs.version }} already exists; updating the asset instead."
            gh release upload "v${{ inputs.version }}" "${{ steps.apk.outputs.path }}" --clobber
          else
            gh release create "v${{ inputs.version }}" \
              "${{ steps.apk.outputs.path }}" \
              --title "CodeDroid v${{ inputs.version }}" \
              --notes "$NOTES" \
              ${{ inputs.prerelease && '--prerelease' || '' }}
          fi

      - name: Upload APK as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codedroid-v${{ inputs.version }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30
          if-no-files-found: error
